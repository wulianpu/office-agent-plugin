# Production Readiness Gate — engine-backed required lane (issue #15 P1-high-1)
#
# This lane is REQUIRED and engine-positive: it must PROVE that a pinned
# OfficeCLI is installed, probed, and that the engine-backed Agent suite
# actually EXECUTED (executed count > 0). Unlike the hermetic lanes, no
# step here may self-skip on missing engine — a missing engine is RED.
name: engine-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Keep the job/context names stable: the main-required-ci-gate ruleset may
# be extended to require this context once the lane is proven stable.

jobs:
  engine:
    runs-on: windows-latest
    env:
      OFFICECLI_PIN: "1.0.151"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # Pinned, REQUIRED install: failure is red (no continue-on-error).
      - name: Install OfficeCLI (pinned ${{ env.OFFICECLI_PIN }})
        run: npm install -g @officecli/officecli@${{ env.OFFICECLI_PIN }}

      # REQUIRED probe: record the version into the log AND an artifact;
      # a failed probe fails the job. `officecli --version` must run.
      - name: Probe OfficeCLI
        shell: pwsh
        run: |
          $v = officecli --version
          if ($LASTEXITCODE -ne 0) { throw "officecli probe failed (exit $LASTEXITCODE)" }
          # Round 24: export the ACTUAL version for bench provenance (the
          # bench artifact records officecli identity via this env).
          "OFFICECLI_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "officecli $v" | Out-File -FilePath officecli-version.txt -Encoding utf8
          Get-Content officecli-version.txt
          "officecli=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install
        run: npm ci
      - name: Build vendor bundles
        run: npm run build:vendor
      - name: Build dist
        run: npx tsc -p tsconfig.json
      - name: Check (src + tests)
        run: npm run check

      # Engine-backed integration: hermetic-only environments self-skip, so
      # here the engine is guaranteed — any skip of the core Agent suites
      # fails the gate via the executed-count guard script below.
      # production-compat (issue #15 round 30): the REAL corpus must go
      # through the Agent write path + cold restart + external reopen here.
      - name: Engine-backed integration (Agent/resident/restart/production corpus)
        run: npx vitest run test/integration/agent-write-path.test.ts test/integration/lease-fencing.test.ts test/integration/process-restart.test.ts test/integration/candidate-safety.test.ts test/integration/production-compat.test.ts --reporter=junit --outputFile.junit=test-results/engine-junit.xml

      # Guard (issue #15 round 26): per-suite executed>0 for the CORE engine
      # suites — aggregate executed>0 is not enough, because a probe/shim
      # mismatch could skip all real engine suites while lease-fencing still
      # runs non-engine fencing tests and keeps the aggregate green.
      - name: Verify core engine suites actually executed (per-suite)
        shell: pwsh
        run: |
          [xml]$xml = Get-Content test-results/engine-junit.xml
          $required = @('agent-write-path','lease-fencing','process-restart','candidate-safety','production-compat')
          $failed = @()
          foreach ($req in $required) {
            $suite = $xml.testsuites.testsuite | Where-Object { $_.name -like ('*' + $req + '*') }
            if (-not $suite) { $failed += ("missing suite: " + $req); continue }
            $tests = [int]$suite.tests
            $skipped = [int]$suite.skipped
            $executed = $tests - $skipped
            "suite ${req}: tests=$tests skipped=$skipped executed=$executed"
            if ($tests -le 0 -or $executed -le 0) { $failed += ("suite not executed: " + $req) }
          }
          if ($failed.Count -gt 0) { throw ($failed -join '; ') }

      - name: Upload engine gate results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-gate-results
          path: |
            test-results/
            officecli-version.txt

  # Benchmark hard-limit gate (issue #15 review: RELEASE.md claims a bench
  # step that did not exist — this job makes that claim true). Machine-
  # readable bench-metrics.json is uploaded bound to the exact SHA; a gate
  # violation is RED. Runs on the pinned engine, same as required CI.
  bench:
    runs-on: windows-latest
    env:
      OFFICECLI_PIN: "1.0.151"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install OfficeCLI (pinned ${{ env.OFFICECLI_PIN }})
        run: npm install -g @officecli/officecli@${{ env.OFFICECLI_PIN }}
      - name: Probe OfficeCLI
        shell: pwsh
        run: |
          $v = officecli --version
          if ($LASTEXITCODE -ne 0) { throw "officecli probe failed (exit $LASTEXITCODE)" }
          "OFFICECLI_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Long-path TEMP (libuv fs-event 8.3 crash workaround)
        shell: pwsh
        run: |
          $longTemp = "D:\a\_longtemp"
          New-Item -ItemType Directory -Force -Path $longTemp | Out-Null
          "TEMP=$longTemp" >> $env:GITHUB_ENV
          "TMP=$longTemp" >> $env:GITHUB_ENV
      - name: Install
        run: npm ci
      - name: Build vendor bundles
        run: npm run build:vendor
      - name: Build dist
        run: npx tsc -p tsconfig.json
      - name: Generate golden corpus (.corpus is gitignored by design)
        run: node tools/corpus/generate.mjs
      - name: Benchmark (tools/bench/gate.mjs hard limits)
        run: |
          node -e "require('fs').rmSync('bench-metrics.json', { force: true })"
          node tools/bench/run.mjs
          node tools/bench/gate.mjs bench-metrics.json
      - name: Upload bench metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-metrics
          path: |
            bench-metrics.json
            officecli-version.txt
