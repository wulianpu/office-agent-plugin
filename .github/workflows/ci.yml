name: ci

on:
  push:
    branches: [main]
  pull_request:

# Failure visibility (round 7): every suite runs with the verbose reporter
# (per-test pass/fail lines in the log) PLUS JUnit output uploaded on
# failure — a red job must name the exact test file + case, never just the
# step. No `|| true` / continue-on-error on test steps: a red test is red.

jobs:
  windows:
    # Full environment: OfficeCLI engine + WPS COM host are available on the
    # dev machine's runner image expectations. Falls back gracefully via the
    # engine probes built into the suites.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install OfficeCLI (non-fatal; suites self-skip without it)
        shell: pwsh
        continue-on-error: true
        run: npm install -g @officecli/officecli
      - name: Install
        run: npm ci
      - name: Build vendor bundles
        run: npm run build:vendor
      - name: Check (src + tests)
        run: npm run check
      - name: Unit tests
        run: npx vitest run test/unit --reporter=verbose --reporter=junit --outputFile.junit=test-results/unit-junit.xml
      - name: Integration tests
        run: npx vitest run test/integration --reporter=verbose --reporter=junit --outputFile.junit=test-results/integration-junit.xml
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: test-results/

  linux:
    # No OfficeCLI/WPS on CI runners: engine-dependent suites skip themselves
    # via their top-level probes; contracts/unit/hermetic paths still gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm ci
      - name: Build vendor bundles
        run: npm run build:vendor
      - name: Check (src + tests)
        run: npm run check
      - name: Unit tests
        run: npx vitest run test/unit --reporter=verbose --reporter=junit --outputFile.junit=test-results/unit-junit.xml
      - name: Integration (engine suites self-skip via probes)
        run: npx vitest run test/integration --reporter=verbose --reporter=junit --outputFile.junit=test-results/integration-junit.xml
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: test-results/
